<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Perch</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 360px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      color: #333;
      background-color: #fff;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #1a1a1a;
        color: #f0f0f0;
      }
    }

    .container {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header {
      font-weight: 600;
      font-size: 14px;
      color: #0066cc;
    }

    @media (prefers-color-scheme: dark) {
      .header {
        color: #66b3ff;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-weight: 500;
      font-size: 12px;
      color: #666;
    }

    @media (prefers-color-scheme: dark) {
      label {
        color: #999;
      }
    }

    input[type="text"],
    input[type="url"],
    input[type="email"] {
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
      background-color: #fff;
      color: #333;
    }

    @media (prefers-color-scheme: dark) {
      input[type="text"],
      input[type="url"],
      input[type="email"] {
        background-color: #2a2a2a;
        color: #f0f0f0;
        border-color: #444;
      }
    }

    input[type="text"]:focus,
    input[type="url"]:focus,
    input[type="email"]:focus {
      outline: none;
      border-color: #0066cc;
      box-shadow: 0 0 0 2px rgba(0, 102, 204, 0.1);
    }

    @media (prefers-color-scheme: dark) {
      input[type="text"]:focus,
      input[type="url"]:focus,
      input[type="email"]:focus {
        box-shadow: 0 0 0 2px rgba(102, 179, 255, 0.2);
      }
    }

    .title-display {
      word-break: break-word;
      padding: 8px;
      background-color: #f5f5f5;
      border-radius: 4px;
      font-size: 12px;
    }

    @media (prefers-color-scheme: dark) {
      .title-display {
        background-color: #2a2a2a;
      }
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      background-color: #0066cc;
      color: white;
    }

    button:hover {
      background-color: #0052a3;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
      opacity: 0.6;
    }

    @media (prefers-color-scheme: dark) {
      button {
        background-color: #0066cc;
      }

      button:hover {
        background-color: #0052a3;
      }

      button:disabled {
        background-color: #444;
      }
    }

    .status {
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      display: none;
      text-align: center;
    }

    .status.show {
      display: block;
    }

    .status.saving {
      background-color: #e3f2fd;
      color: #0066cc;
    }

    .status.success {
      background-color: #e8f5e9;
      color: #2e7d32;
    }

    .status.error {
      background-color: #ffebee;
      color: #c62828;
    }

    @media (prefers-color-scheme: dark) {
      .status.saving {
        background-color: #1a3a52;
        color: #66b3ff;
      }

      .status.success {
        background-color: #1b5e20;
        color: #81c784;
      }

      .status.error {
        background-color: #42000c;
        color: #ef5350;
      }
    }

    .error-message {
      font-size: 11px;
      margin-top: 4px;
      word-break: break-word;
    }

    .setup-notice {
      background-color: #fff3cd;
      color: #856404;
      padding: 12px;
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.6;
    }

    @media (prefers-color-scheme: dark) {
      .setup-notice {
        background-color: #332701;
        color: #ffb300;
      }
    }

    .setup-notice a {
      color: inherit;
      text-decoration: underline;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">Save to The Perch</div>

    <div id="setup-notice" class="setup-notice" style="display: none;">
      Please configure your Supabase credentials in the
      <a href="#" id="open-options">extension options</a>.
    </div>

    <form id="bookmark-form" style="display: none;">
      <div class="form-group">
        <label for="page-title">Page Title</label>
        <div class="title-display" id="page-title">Loading...</div>
      </div>

      <div class="form-group">
        <label for="page-url">URL</label>
        <input type="url" id="page-url" readonly>
      </div>

      <div class="form-group">
        <label for="tags">Tags (comma-separated)</label>
        <input type="text" id="tags" placeholder="e.g., dev, javascript, tutorial">
      </div>

      <button type="submit">Save Bookmark</button>

      <div id="status" class="status"></div>
    </form>
  </div>

  <script src="popup.js"></script>
</body>
</html>
