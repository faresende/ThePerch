# .gitleaks.toml
#
# Custom gitleaks config. Extends the default rules and adds path-level
# exclusions for files that intentionally contain patterns gitleaks treats
# as credential-like (commit-SHA lists, docs archive, etc.).

[extend]
useDefault = true

[allowlist]
description = "Paths gitleaks should skip entirely"
paths = [
    # The allowlist file itself — contains commit SHAs that look like
    # generic-api-key to the detector.
    '''\.gitleaksignore$''',
    # This config file (self-reference for completeness).
    '''\.gitleaks\.toml$''',
    # Internal/historical docs that intentionally reference old values
    # as scrub targets or in incident narratives.
    '''docs/archive/''',
    # Personal-data staging area (gitignored in practice but in case it ever
    # gets scanned locally).
    '''supabase/personal-data/''',
]

# Always-allowed string patterns (test fixtures, doc placeholders).
# These apply to the current working tree as well as history.
regexes = [
    # ShareExtensionTests.swift fixtures
    '''test-anon-key-[0-9]+''',
    '''test-access-token-[0-9]+''',
    '''user-id-[0-9]+''',
    # Standard JWT header prefix shown as an example in docs (decodes to
    # {"alg":"HS256","typ":"JWT"}, not a real signing key).
    '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.\.\.''',
]

# Historical commits with findings that have all been verified safe:
# - 4be29384 / f2eeb82d: JWT header placeholder in GETTING_STARTED.md and
#   test fixtures in ShareExtensionTests.swift (both false positives)
# - c98d7090: Telegram bot token in deploy-testflight.sh — rotated on
#   2026-04-21 via BotFather /revoke; the leaked string is dead.
commits = [
